name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback for the pure-Kotlin DOCX engine.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: DOCX engine tests
        shell: bash
        run: gradle :core:docx:test --stacktrace 2>&1 | tee build.log

      - name: Summarize results
        if: always()
        shell: bash
        run: bash .github/scripts/summarize.sh build.log core/docx/build/test-results/test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports
          path: core/docx/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: docx-samples
          path: core/docx/build/samples/
          if-no-files-found: error

  # Opens documents produced by the engine in LibreOffice, an independent implementation.
  compat:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docx-samples
          path: samples

      - name: Install LibreOffice and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core

      - name: Check samples in LibreOffice
        run: python3 .github/scripts/check_compat.py samples compat-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-output
          path: compat-out/

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Unit tests
        shell: bash
        run: gradle testDebugUnitTest :core:docx:test --stacktrace 2>&1 | tee build.log

      - name: Summarize results
        if: always()
        shell: bash
        run: bash .github/scripts/summarize.sh build.log core/docx/build/test-results/test app/build/test-results/testDebugUnitTest

      - name: Lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: smart-word-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.html
