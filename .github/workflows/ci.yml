name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast feedback for the pure-Kotlin DOCX engine.
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: DOCX engine tests
        shell: bash
        run: gradle :core:docx:test --stacktrace 2>&1 | tee build.log

      - name: Summarize results
        if: always()
        shell: bash
        run: bash .github/scripts/summarize.sh build.log core/docx/build/test-results/test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-reports
          path: core/docx/build/reports/tests/

      - uses: actions/upload-artifact@v4
        with:
          name: docx-samples
          path: core/docx/build/samples/
          if-no-files-found: error

  # Opens documents produced by the engine in LibreOffice, an independent implementation.
  compat:
    needs: core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: docx-samples
          path: samples

      - name: Install LibreOffice and PDF tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer poppler-utils fonts-dejavu-core

      - name: Check samples in LibreOffice
        run: python3 .github/scripts/check_compat.py samples compat-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compat-output
          path: compat-out/

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Unit tests
        shell: bash
        run: gradle testDebugUnitTest :core:docx:test --stacktrace 2>&1 | tee build.log

      - name: Summarize results
        if: always()
        shell: bash
        run: bash .github/scripts/summarize.sh build.log core/docx/build/test-results/test app/build/test-results/testDebugUnitTest

      - name: Lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Verify the APK is an installable debug build
        shell: bash
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          echo "APK: $APK ($(du -h "$APK" | cut -f1)), build-tools: $BT"
          "$BT/aapt2" dump badging "$APK" > badging.txt
          grep -E "^package:|^sdkVersion|^targetSdkVersion|application-debuggable|^application-label:" badging.txt
          grep -q "name='com.smartword.app'" badging.txt
          grep -q "^sdkVersion:'26'" badging.txt
          grep -q "application-debuggable" badging.txt
          "$BT/apksigner" verify --verbose "$APK" | tee signing.txt
          grep -q "Verifies" signing.txt

      - uses: actions/upload-artifact@v4
        with:
          name: smart-word-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-debug.html

      # A direct download link (no GitHub artifact zip): the debug APK and the test documents.
      - name: Publish debug APK as a pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          cp app/build/outputs/apk/debug/*.apk Smart-Word-debug.apk
          gh release delete debug-latest --cleanup-tag --yes || true
          gh release create debug-latest --prerelease --target "$GITHUB_SHA" \
            --title "Smart Word - debug build ($(git rev-parse --short HEAD))" \
            --notes "Debug APK built by CI from commit $GITHUB_SHA. For testing only, not a release." \
            Smart-Word-debug.apk docs/test-files/*.docx
